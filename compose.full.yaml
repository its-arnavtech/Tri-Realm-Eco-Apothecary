services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brew67
      POSTGRES_USER: brew
      POSTGRES_PASSWORD: brew
    volumes:
      - brew67_full_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brew -d brew67"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./apps/api
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://brew:brew@db:5432/brew67
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./apps/api
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://brew:brew@db:5432/brew67
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_FROM: noreply@localhost
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./apps/api
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://brew:brew@db:5432/brew67
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_FROM: noreply@localhost
    command: ["sh", "-c", "while true; do python -m app.jobs; sleep 60; done"]
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      TERMS_URL: ${TERMS_URL:-}
      REFUND_POLICY_URL: ${REFUND_POLICY_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  brew67_full_db:
