name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: brew67
          POSTGRES_USER: brew
          POSTGRES_PASSWORD: brew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brew -d brew67"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://brew:brew@localhost:5432/brew67
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m app.seed

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit --requirement apps/api/requirements.lock --disable-pip --no-deps --strict
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm audit --audit-level high
        working-directory: apps/web

  containers:
    runs-on: ubuntu-latest
    needs: [api, web, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brew67-api:test apps/api
      - run: docker build --build-arg API_INTERNAL_URL=http://api:8000 -t brew67-web:test apps/web
